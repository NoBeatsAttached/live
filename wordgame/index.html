:root{
  --panel:#050506;
  --line:#212429;
  --line2:#2E3238;
  --bone:#EDEDEB;
  --silver:#B4B9BF;
  --steel:#9AA0A8;
  --blue:#3A93D6;
  --tile:30px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
body{font-family:'Code',monospace;color:var(--bone);-webkit-font-smoothing:antialiased}
#stage{position:absolute;top:0;left:0;transform-origin:top left;padding:8px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 18px 13px 20px;width:520px;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;padding-right:8px}
.cat{font-size:17px;letter-spacing:.1em;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-size:14px;letter-spacing:.08em;color:var(--bone);white-space:nowrap}

.tiles{display:flex;flex-wrap:nowrap;gap:5px;height:var(--tile)}
.t{flex:0 0 var(--tile);height:var(--tile);display:flex;align-items:center;justify-content:center;
   font-size:calc(var(--tile)*.58);border:1px solid #3A3F47;border-bottom:3px solid #5A6068;background:#15171B;color:transparent;
   transition:color .2s,border-color .2s,background .3s}
.t.on{color:#fff;border-color:#5A6068;border-bottom-color:var(--bone);background:#1E2126}
.t.new{animation:pop .7s ease-out}
.t.gap{flex-basis:calc(var(--tile)*.4);background:none;border:none}
@keyframes pop{0%{color:var(--blue);border-color:var(--blue);transform:translateY(-3px)}100%{transform:none}}
.card.won .t{color:var(--bone);border-color:var(--blue);background:rgba(58,147,214,.14)}
.card.won .t.gap,.t.gap{background:none;border:none}


.foot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px}
.hint{font-size:13px;letter-spacing:.08em;color:var(--steel);white-space:nowrap}
.msg{min-width:0;font-size:15px;letter-spacing:.08em;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .who{color:var(--blue)}
.msg .pts{color:var(--bone)}
.msg .g{color:var(--steel)}
.board{margin-top:7px;font-size:13px;letter-spacing:.06em;color:var(--steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board:empty{display:none}
.board b{color:var(--bone);font-weight:normal}
.board .d{color:var(--line2);margin:0 6px}

.live{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--line2)}
.live.ok{background:var(--blue)}

/* test-mode chat box (only shows with ?test=1) */
#tester{display:none;margin-top:8px;gap:6px;width:520px}
#tester.show{display:flex}
#tester input{font-family:'Code',monospace;background:#0B0C0F;color:var(--bone);border:1px solid var(--line2);padding:8px 10px;font-size:13px;letter-spacing:.1em;outline:none}
#tester input:focus{border-color:var(--blue)}
#tester .u{width:120px}#tester .m{min-width:0}
#tester .m{flex:1}
</style>

<body>
<div id="stage">
  <div class="card" id="card">
    <div class="live" id="live" title="chat connection"></div>
    <div class="head">
      <div class="cat" id="cat"></div>
      <div class="title">GUESS THE WORD</div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="foot"><div class="msg" id="msg">TYPE YOUR GUESS IN CHAT</div><div class="hint" id="hint"></div></div>
    <div class="board" id="board"></div>
  </div>
  <div id="tester">
    <input class="u" id="tu" value="testuser" placeholder="username">
    <input class="m" id="tm" placeholder="type a guess + enter">
  </div>
</div>

<script>
(() => {
/* ---------------- settings (all optional URL params) ----------------
   ?channel=grexbeatz   which Twitch chat to read
   ?hint=20             seconds between free letter reveals (stops with 1 letter left)
   ?gap=8               seconds the answer stays up before the next word
   ?scale=1             size multiplier for the whole overlay
   ?ignore=a,b          extra usernames to ignore (bots are ignored already)
   ?reset=1             wipe the leaderboard once, then remove it from the URL
   ?test=1              shows a fake-chat box so you can play it in a normal browser
---------------------------------------------------------------------- */
const P = new URLSearchParams(location.search);
const num = (k, d, lo, hi) => { const v = parseFloat(P.get(k)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
const CHANNEL = (P.get('channel') || 'grexbeatz').toLowerCase().replace(/^#/, '');
const GAP_S = num('gap', 8, 2, 120);
const HINT_S = num('hint', 20, 5, 300);
const SCALE = num('scale', 1, .3, 4);
const TEST = P.get('test') === '1';
const IGNORE = new Set(['streamelements','nightbot','fossabot','moobot','streamlabs','soundalerts','sery_bot','wizebot','botrixoficial','kofistreambot',
  ...(P.get('ignore') || '').toLowerCase().split(',').map(s => s.trim()).filter(Boolean)]);

/* ---------------- word bank ---------------- */
const BANK = {
  'DRUMS': ['KICK','SNARE','HI HAT','CLAP','RIMSHOT','CRASH','RIDE','SHAKER','CONGA','BONGO','COWBELL','TAMBOURINE','BREAKBEAT','808','OPEN HAT','GHOST NOTE','DRUM ROLL','TOM'],
  'GEAR': ['SYNTH','SAMPLER','SEQUENCER','MIXER','MONITORS','HEADPHONES','MICROPHONE','INTERFACE','CONTROLLER','TURNTABLE','VINYL','CROSSFADER','MPC','FADER','KNOB','PATCH CABLE','DRUM MACHINE','MIDI KEYBOARD','POP FILTER','SUBWOOFER'],
  'SOUND DESIGN': ['OSCILLATOR','WAVETABLE','ENVELOPE','ATTACK','DECAY','SUSTAIN','RELEASE','FILTER','RESONANCE','CUTOFF','LFO','DETUNE','UNISON','WHITE NOISE','SAWTOOTH','SINE WAVE','WOBBLE','GRANULAR','FM SYNTHESIS','PORTAMENTO','GLIDE','PATCH','MODULATION','SUB BASS'],
  'MIXING': ['COMPRESSOR','LIMITER','REVERB','DELAY','PHASER','FLANGER','DISTORTION','SATURATION','SIDECHAIN','GAIN','PANNING','MASTERING','HEADROOM','CLIPPING','STEREO','MONO','AUTOMATION','BUS','EQUALIZER','TRANSIENT','LOUDNESS','DITHER','BITCRUSHER','OVERDRIVE','TAPE STOP','VOCODER','AUTOTUNE'],
  'THEORY': ['CHORD','MELODY','HARMONY','TEMPO','RHYTHM','TRIPLET','SYNCOPATION','OCTAVE','SCALE','MINOR','MAJOR','ARPEGGIO','INTERVAL','TRANSPOSE','SWING','GROOVE','BPM','DOWNBEAT','MEASURE','CADENCE','CHROMATIC','TIME SIGNATURE','KEY CHANGE','COUNTERMELODY','INVERSION','BASSLINE'],
  'INSTRUMENTS': ['PIANO','KEYS','GUITAR','BASS GUITAR','VIOLIN','CELLO','ORGAN','RHODES','SAXOPHONE','TRUMPET','FLUTE','HARP','STRINGS','CHOIR','BRASS','MARIMBA','VIBRAPHONE','KALIMBA','SITAR','HARPSICHORD','UPRIGHT BASS','STEEL DRUM','GLOCKENSPIEL','BANJO'],
  'IN THE STUDIO': ['SAMPLE','LOOP','CHOP','FLIP','STEMS','BOUNCE','EXPORT','PROJECT','PRESET','PLUGIN','VST','DAW','ABLETON','QUANTIZE','METRONOME','ARRANGEMENT','HOOK','VERSE','BRIDGE','INTRO','OUTRO','DROP','BUILDUP','BREAKDOWN','FILL','BEAT','REMIX','BOOTLEG','MASHUP','MIXTAPE','DEMO','TAKE','PUNCH IN','SESSION','WORKFLOW','RESAMPLE','PIANO ROLL','CRATE DIGGING','SCRATCH','TIME STRETCH'],
  'GENRES': ['DUBSTEP','TRAP','DRILL','BOOM BAP','LOFI','HOUSE','TECHNO','JUNGLE','GARAGE','GRIME','RIDDIM','HALFTIME','FUNK','SOUL','JAZZ','GOSPEL','DISCO','PHONK','FOOTWORK','DRUM AND BASS','AMBIENT','HIP HOP','RNB','BREAKS','DEEP HOUSE','JERSEY CLUB','DETROIT TECHNO','GHETTOTECH','TRIP HOP','DOWNTEMPO']
};
const DECK_ALL = [];
for (const [cat, words] of Object.entries(BANK)) for (const w of words) DECK_ALL.push({ cat, word: w });

/* ---------------- real-word check (stops "aaaaa" spam) ----------------
   words.txt sits next to this page: ~250k English words (MIT, from the word-list package).
   Every word/part of a word in the game's own bank also counts, so slang like RIDDIM works. */
const BANK_TOKENS = new Set();
for (const d of DECK_ALL) for (const t of d.word.toLowerCase().split(' ')) BANK_TOKENS.add(t);
let DICT = null;
fetch('words.txt').then(r => r.ok ? r.text() : Promise.reject()).then(t => { DICT = new Set(t.split('\n')); }).catch(() => {});
function looksReal(tok) {
  tok = tok.toLowerCase();
  if (BANK_TOKENS.has(tok)) return true;
  if (DICT) return DICT.has(tok);
  // backup rule if the list failed to load: needs a vowel and no letter spam
  const counts = {}; for (const c of tok) counts[c] = (counts[c] || 0) + 1;
  return /[aeiouy]/.test(tok) && Math.max(...Object.values(counts)) <= Math.max(2, Math.ceil(tok.length / 3));
}
const lastGuess = {};   // per-user cooldown so nobody machine-guns words

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const norm = s => s.toUpperCase().normalize('NFKD').replace(/[^A-Z0-9]+/g, ' ').trim();
const compact = s => norm(s).replace(/ /g, '');
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

$('stage').style.transform = `scale(${SCALE})`;

/* ---------------- storage (leaderboard survives OBS restarts) ---------------- */
const KEY = 'gtw_scores_' + CHANNEL;
const DKEY = 'gtw_deck_' + CHANNEL;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
if (P.get('reset') === '1') { store.del(KEY); store.del(DKEY); }
let scores = store.get(KEY, {}); // { login: { name, pts } }

function renderBoard() {
  const top = Object.values(scores).sort((a, b) => b.pts - a.pts).slice(0, 3);
  $('board').innerHTML = top.length
    ? top.map((s, i) => `${i + 1} <b>${esc(s.name.length > 12 ? s.name.slice(0, 11) + '…' : s.name)}</b> ${s.pts}`).join('<span class="d">/</span>')
    : '';
}

/* deck: every word gets played once before any repeats (remembered across restarts) */
function nextWord() {
  let deck = store.get(DKEY, null);
  if (!Array.isArray(deck) || !deck.length || deck.some(i => !DECK_ALL[i])) deck = shuffle(DECK_ALL.map((_, i) => i));
  const idx = deck.shift();
  store.set(DKEY, deck);
  return DECK_ALL[idx];
}

/* ---------------- game ---------------- */
let round = null;   // { cat, word, chars, shown:Set, hiddenIdx:[], state }
let tickT = null, hintAt = 0, hintT = null;

function letterIdx(word) { return [...word].map((c, i) => c === ' ' ? -1 : i).filter(i => i >= 0); }

function drawTiles(fresh = []) {
  const chars = [...round.word];
  const len = chars.filter(c => c !== ' ').length;
  const spaces = chars.length - len;
  const inner = 520 - 38 - 2;            // card width minus padding/border
  const fit = Math.floor((inner - 5 * (chars.length - 1)) / (len + spaces * .4));
  const size = Math.max(20, Math.min(46, fit));
  document.documentElement.style.setProperty('--tile', size + 'px');
  $('tiles').innerHTML = chars.map((c, i) => c === ' '
    ? '<div class="t gap"></div>'
    : `<div class="t${round.shown.has(i) ? ' on' : ''}${fresh.includes(i) ? ' new' : ''}">${esc(c)}</div>`).join('');
}

function prompt() {
  return `<span class="pts">${round.target.length} LETTERS</span> &middot; GUESS IN CHAT`;
}

function startRound() {
  clearTimeout(tickT);
  const { cat, word } = nextWord();
  const idx = letterIdx(word);
  // pos[k] = index in `word` of the k-th letter (so spaces in two-word answers are skipped)
  round = { cat, word, target: compact(word), pos: idx, shown: new Set(), state: 'live' };
  $('card').classList.remove('won', 'miss');
  $('cat').textContent = cat;
  $('msg').innerHTML = prompt();
  drawTiles();
  armHint();
}

function armHint() { hintAt = Date.now() + HINT_S * 1000; }
function hintLoop() {
  clearInterval(hintT);
  hintT = setInterval(() => {
    if (!round || round.state !== 'live') { $('hint').textContent = ''; return; }
    const hidden = round.pos.filter(i => !round.shown.has(i));
    if (hidden.length <= 1) { $('hint').textContent = 'LAST LETTER'; return; }
    const left = Math.ceil((hintAt - Date.now()) / 1000);
    if (left <= 0) {
      const i = hidden[Math.random() * hidden.length | 0];
      round.shown.add(i);
      drawTiles([i]);
      armHint();
      return;
    }
    $('hint').textContent = 'HINT IN ' + left;
  }, 250);
}

function hiddenCount() { return round.pos.filter(i => !round.shown.has(i)).length; }

function addPts(who, pts) {
  const rec = scores[who.login] || { name: who.name, pts: 0 };
  rec.name = who.name; rec.pts += pts;
  scores[who.login] = rec;
  store.set(KEY, scores);
  renderBoard();
}

function endRound(winner, pts) {
  clearTimeout(tickT);
  round.state = 'done';
  $('hint').textContent = '';
  round.pos.forEach(i => round.shown.add(i));
  drawTiles();
  addPts(winner, pts);
  $('card').classList.add('won');
  $('msg').innerHTML = `<span class="who">${esc(winner.name)}</span> GOT IT <span class="pts">+${pts}</span>`;
  tickT = setTimeout(startRound, GAP_S * 1000);
}

function onChat(login, name, text) {
  if (!round || round.state !== 'live') return;
  if (IGNORE.has(login)) return;
  const n = norm(text);
  if (!n) return;
  const who = { login, name: name || login };

  // exact word (or the word inside the message, e.g. "is it synth") = win
  if (n.replace(/ /g, '') === round.target || (' ' + n + ' ').includes(' ' + norm(round.word) + ' ')) {
    return endRound(who, 5 + hiddenCount() * 3);
  }

  // otherwise it only counts as a guess if it's the same length (ignores normal chat)
  const g = n.replace(/ /g, '');
  const toks = n.split(' ');
  if (toks.length > 3 || g.length !== round.target.length) return;
  if (!toks.every(looksReal)) return;                       // must be real word(s)
  const now = Date.now();
  if (now - (lastGuess[login] || 0) < 2500) return;          // one guess per 2.5s per person
  lastGuess[login] = now;

  // any letter in the right spot stays revealed
  const fresh = [];
  for (let k = 0; k < g.length; k++) {
    const i = round.pos[k];
    if (g[k] === round.target[k] && !round.shown.has(i)) { round.shown.add(i); fresh.push(i); }
  }
  if (!fresh.length) return;
  if (hiddenCount() === 0) return endRound(who, 5);   // chat filled in the last letter
  drawTiles(fresh);
  addPts(who, fresh.length);
  $('msg').innerHTML = `<span class="who">${esc(who.name)}</span> <span class="g">${esc(g)}</span> +${fresh.length}`;
  clearTimeout(tickT);
  tickT = setTimeout(() => { if (round.state === 'live') $('msg').innerHTML = prompt(); }, 4000);
}

/* ---------------- Twitch chat (read-only, anonymous, no keys) ---------------- */
let ws = null, backoff = 1000, pingT = null;
function connect() {
  try { ws && ws.close(); } catch {}
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + (10000 + (Math.random() * 80000 | 0)));
    ws.send('JOIN #' + CHANNEL);
  };
  ws.onmessage = e => {
    for (const line of String(e.data).split('\r\n')) {
      if (!line) continue;
      if (line.startsWith('PING')) { ws.send('PONG' + line.slice(4)); continue; }
      if (line.includes(' 366 ')) { $('live').classList.add('ok'); backoff = 1000; } // joined
      const m = line.match(/^(?:@(\S+) )?:(\w+)!\S+ PRIVMSG #\S+ :(.*)$/);
      if (!m) continue;
      let name = m[2];
      if (m[1]) { const dn = m[1].match(/(?:^|;)display-name=([^;]*)/); if (dn && dn[1]) name = dn[1]; }
      onChat(m[2].toLowerCase(), name, m[3]);
    }
  };
  ws.onclose = () => {
    $('live').classList.remove('ok');
    clearTimeout(pingT);
    pingT = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 30000);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

/* ---------------- test box ---------------- */
if (TEST) {
  $('tester').classList.add('show');
  $('tm').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const u = $('tu').value.trim() || 'testuser';
    onChat(u.toLowerCase(), u, $('tm').value);
    $('tm').value = '';
  });
  window.__answer = () => round && round.word; // console peek for testing
  window.__force = (cat, word) => { round = { cat, word, target: compact(word), pos: letterIdx(word), shown: new Set(), state: 'live' }; $('card').classList.remove('won','miss'); $('cat').textContent = cat; $('msg').innerHTML = prompt(); drawTiles(); };
}

renderBoard();
startRound();
hintLoop();
if (!TEST || P.get('channel')) connect();
})();
