:root{
  --void:#050506; --panel:#0B0C0F; --panel2:#121419;
  --line:#212429; --line2:#2E3238;
  --text:#EDEDEB; --dim:#B4B9BF; --dimmer:#676C74;
  --acc:#3A93D6; --hot:#D8455F;
  --h:58px; --fs:17px; --pad:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'JetBrains Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}

/* ============ OVERLAY ============ */
body.ov{background:transparent;width:100%;height:100%;overflow:hidden}
#bar{position:fixed;left:0;right:0;display:flex;align-items:stretch;height:var(--h);
  background:#050506;
  border-bottom:1px solid var(--line);opacity:0;transition:opacity .5s ease}
#bar.in{opacity:1}
body[data-pos="top"] #bar{top:0}
body[data-pos="bottom"] #bar{bottom:0;border-bottom:none;border-top:1px solid var(--line);
  background:#050506}
#pin{display:flex;align-items:center;gap:var(--pad);padding:0 var(--pad);flex:none;
  position:relative;z-index:2;background:#050506;
  box-shadow:14px 0 18px -6px #050506}
#pin.off{display:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 8px rgba(58,147,214,.75);animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.brand{font-family:'Code',ui-monospace,monospace;font-size:var(--fs);letter-spacing:.2em;
  color:#fff;line-height:1;white-space:nowrap}
.brand .z{color:var(--acc)}
.rule{width:1px;height:18px;background:var(--line);flex:none}
.sched{font-size:var(--fs);letter-spacing:.14em;color:var(--text);font-weight:700;
  line-height:1;white-space:nowrap}
#tickwrap{flex:1;min-width:0;overflow:hidden;position:relative;display:flex;align-items:center}
#track{display:flex;flex:none;will-change:transform}
#track.run{animation:scroll var(--dur,55s) linear infinite}
@keyframes scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.seq{display:flex;flex:none;align-items:center}
.item{font-size:var(--fs);letter-spacing:.14em;color:var(--dim);font-weight:500;
  white-space:nowrap;padding-left:var(--pad);line-height:1}
.item b{color:var(--text);font-weight:700}
.item i{color:var(--acc);font-style:normal;font-weight:700}
.sep{color:var(--acc);opacity:.55;padding-left:var(--pad);font-weight:700;font-size:var(--fs);
  line-height:1;flex:none}
#tickwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:48px;
  background:linear-gradient(90deg,rgba(5,5,6,0),#050506);pointer-events:none}

/* ============ DECK ============ */
body.deck{background:var(--void);color:var(--text);min-height:100vh;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
header .brand{font-size:16px}
.stat{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;
  letter-spacing:.16em;color:var(--dimmer)}
.led{width:7px;height:7px;border-radius:50%;background:var(--dimmer)}
.led.on{background:var(--acc);box-shadow:0 0 8px rgba(58,147,214,.8)}
label{display:block;font-size:10px;letter-spacing:.22em;color:var(--dimmer);margin:0 0 7px}
input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--line2);
  color:var(--text);font:500 15px/1.4 'JetBrains Mono',monospace;padding:13px 14px;border-radius:9px;
  letter-spacing:.04em}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
button{font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.16em;border:1px solid var(--line2);
  background:var(--panel2);color:var(--text);padding:15px 16px;border-radius:9px;cursor:pointer}
button:active{transform:translateY(1px)}
.pri{background:var(--acc);border-color:var(--acc);color:#04121d}
.row{display:flex;gap:9px;margin-top:10px}
.row button{flex:none}
.row input{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}
ul{list-style:none}
li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:none}
li .txt{flex:1;min-width:0;font-size:13.5px;letter-spacing:.05em;word-break:break-word;line-height:1.4}
li.off .txt{color:var(--dimmer);text-decoration:line-through}
li .mini{padding:9px 9px;font-size:11px;border-radius:8px;flex:none;min-width:34px}
li .del{color:var(--hot);border-color:#3a2229}
.hint{font-size:11px;color:var(--dimmer);letter-spacing:.06em;line-height:1.6;margin-top:9px}
.big{width:100%;padding:19px;font-size:14px;letter-spacing:.2em;margin-top:4px}
#gate{max-width:340px;margin:16vh auto;padding:0 20px;text-align:center}
#gate .brand{font-size:20px;margin-bottom:26px;display:block}
#err{color:var(--hot);font-size:12px;letter-spacing:.08em;min-height:18px;margin-top:12px}
.sub{font-size:11px;letter-spacing:.16em;color:var(--dimmer);margin-bottom:14px}
input[type=range]{width:100%;accent-color:var(--acc)}
</style>
</head>

<!-- OVERLAY -->
<div id="bar" style="display:none">
  <div id="pin">
    <div class="dot"></div>

<!-- GATE -->
<div id="gate" style="display:none">
  <span class="brand">PR<span class="z">0</span>CESS_LIVE // TICKER</span>

  <input type="password" id="pinbox" inputmode="numeric" placeholder="PIN"
    style="width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);

<!-- DECK -->
<div class="wrap" id="deck" style="display:none">

    <div class="stat"><span class="led" id="led"></span><span id="statTxt">OFFLINE</span></div>
  </header>

  <div class="card">
    <label>ADD MESSAGE — GOES TO THE END OF THE LOOP</label>
    <input type="text" id="newMsg" placeholder="GUEST IN THE BUILDING — @HANDLE" autocomplete="off" />
    <div class="row"><button class="pri" id="add" style="flex:1">ADD TO LOOP</button></div>
    <div class="hint">**bold** for white · [brackets] for blue · pushes live the second you add it</div>
  </div>

  <div class="card">
    <label>LOOP — <span id="cnt">0</span> ACTIVE</label>

    <button class="big" id="push">FORCE PUSH TO OVERLAY</button>
    <div class="hint">Overlay URL — add as a Browser Source, 1920×1080:</div>
    <input type="text" id="ovurl" readonly onclick="this.select()"
      style="width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--line2);
      color:var(--dim);font:400 12px 'JetBrains Mono',monospace;padding:11px;border-radius:8px" />
    <button class="big" id="copyov" style="margin-top:8px">COPY OBS LINK</button>
  </div>

  <button class="big" id="lock" style="color:var(--dimmer)">LOCK DECK</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

var SUPABASE_URL="https://tewcgwhumtmjvfxcvbxl.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_1DZr_3nrtELGlEFIR3SIMA_F_ELXSdn";
var CHANNEL="ch-4vt8be2qmr7y";            /* own channel — never collides with the slam deck */
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:10}}});

/* own storage keys — deliberately NOT pq_* or slam_* */
var PIN=localStorage.getItem("tk_pin")||"", ROLE=localStorage.getItem("tk_role")||"";
var IS_OVERLAY=(location.hash.replace("#","").toLowerCase()==="overlay");
var q=new URLSearchParams(location.search);
var channel=null, overlayUp=false;

var DEFAULTS={
  msgs:[
    {t:"FOLLOW [\u2192] **MON & WED 5PM \u00b7 TUE 4PM ET**",on:1},
    {t:"BEAT BATTLE EVERY WEDNESDAY \u2014 **OPEN TO ANYONE**",on:1},
    {t:"**MON & WED 5PM \u00b7 TUE 4PM \u00b7 ET**",on:1},
    {t:"BEAT BATTLE LEAGUE SEASON 1 \u2014 **STANDINGS LIVE**",on:1},
    {t:"G-REX \u2014 **GREXOFFICIAL.COM**",on:1},
    {t:"JOIN THE DISCORD [!DISCORD]",on:1},
    {t:"CHECK OUT THE HUB [!PROCESSHUB]",on:1}
  ],
  sched:"MON & WED 5PM \u00b7 TUE 4PM \u00b7 ET",
  speed:55
};
function loadState(){
  try{ var s=JSON.parse(localStorage.getItem("tk_state")||"null"); if(s&&s.msgs) return s; }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveState(s){ try{ localStorage.setItem("tk_state",JSON.stringify(s)); }catch(e){} }
var ST=loadState();

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]/g,"<i>$1</i>");
}

/* ---------------- CONNECT ---------------- */
function connect(){
  var key=IS_OVERLAY?"overlay":("deck-"+Math.random().toString(36).slice(2,7));
  channel=sb.channel(CHANNEL,{config:{broadcast:{self:false},presence:{key:key}}});

  channel.on("broadcast",{event:"state"},function(m){
    if(!IS_OVERLAY) return;
    if(m.payload&&m.payload.msgs){ ST=m.payload; saveState(ST); renderOverlay(); }
  });
  /* a fresh overlay asks any open deck for the current loop */
  channel.on("broadcast",{event:"req"},function(){
    if(IS_OVERLAY) return;
    try{ channel.send({type:"broadcast",event:"state",payload:ST}); }catch(e){}
  });
  channel.on("presence",{event:"sync"},function(){
    if(IS_OVERLAY) return;
    var st=channel.presenceState(), found=false;
    Object.keys(st).forEach(function(k){ st[k].forEach(function(m){ if(m.role==="overlay") found=true; }); });
    overlayUp=found; paintStatus();
  });
  channel.subscribe(function(status){
    if(status==="SUBSCRIBED"){
      channel.track({role:IS_OVERLAY?"overlay":"deck",at:Date.now()});
      if(IS_OVERLAY){ try{ channel.send({type:"broadcast",event:"req",payload:{}}); }catch(e){} }
      else paintStatus();
    }
    if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
      overlayUp=false; if(!IS_OVERLAY) paintStatus();
      setTimeout(function(){ try{sb.removeChannel(channel);}catch(e){} connect(); },3000);
    }
  });
}

/* ---------------- OVERLAY ---------------- */
var bar,track,tickwrap;
function renderOverlay(){
  var live=ST.msgs.filter(function(m){return m.on;});
  if(!live.length) live=[{t:"**"+(ST.sched||DEFAULTS.sched)+"**"}];
  var sep=q.get("sep")||"\u25c6";

  function seq(){
    var d=document.createElement("div"); d.className="seq";
    live.forEach(function(m){
      var it=document.createElement("div"); it.className="item"; it.innerHTML=fmt(m.t); d.appendChild(it);
      var sp=document.createElement("div"); sp.className="sep"; sp.textContent=sep; d.appendChild(sp);
    });
    return d;
  }
  track.classList.remove("run");
  track.innerHTML="";
  var a=seq(); track.appendChild(a); track.appendChild(seq());

  requestAnimationFrame(function(){
    var w=a.getBoundingClientRect().width||1200;
    var pps=parseFloat(q.get("speed")||ST.speed||55);
    track.style.setProperty("--dur",Math.max(8,w/pps)+"s");
    void track.offsetWidth;
    track.classList.add("run");
    bar.classList.add("in");
  });
}
function bootOverlay(){
  document.body.className="ov";
  document.body.dataset.pos=(q.get("pos")||"top").toLowerCase();
  var s=parseFloat(q.get("scale")||"1");
  if(s&&s!==1){
    document.body.style.setProperty("--h",(58*s)+"px");
    document.body.style.setProperty("--fs",(17*s)+"px");
    document.body.style.setProperty("--pad",(20*s)+"px");
  }
  if(q.get("pinned")==="0") document.getElementById("pin").classList.add("off");
  bar=document.getElementById("bar"); bar.style.display="flex";
  track=document.getElementById("track"); tickwrap=document.getElementById("tickwrap");
  renderOverlay();          /* cached state paints instantly, before the socket is up */
  connect();
}

/* ---------------- DECK ---------------- */
function paintStatus(){
  var led=document.getElementById("led"), t=document.getElementById("statTxt");
  if(!led) return;
  led.className="led"+(overlayUp?" on":"");
  t.textContent=overlayUp?"OVERLAY LIVE":"OVERLAY OFF";
}
function pushState(){
  saveState(ST);
  if(channel){ try{ channel.send({type:"broadcast",event:"state",payload:ST}); }catch(e){} }
}
function paintList(){
  var ul=document.getElementById("list"); ul.innerHTML="";
  ST.msgs.forEach(function(m,i){
    var li=document.createElement("li"); if(!m.on) li.className="off";
    var tx=document.createElement("div"); tx.className="txt"; tx.innerHTML=fmt(m.t); li.appendChild(tx);

    var up=document.createElement("button"); up.className="mini"; up.textContent="\u2191";
    up.title="move up";
    up.onclick=function(){ if(i>0){ var x=ST.msgs.splice(i,1)[0]; ST.msgs.splice(i-1,0,x); paintList(); pushState(); } };
    li.appendChild(up);

    var dn=document.createElement("button"); dn.className="mini"; dn.textContent="\u2193";
    dn.title="move down";
    dn.onclick=function(){ if(i<ST.msgs.length-1){ var x=ST.msgs.splice(i,1)[0]; ST.msgs.splice(i+1,0,x); paintList(); pushState(); } };
    li.appendChild(dn);

    var ed=document.createElement("button"); ed.className="mini"; ed.textContent="EDIT";
    ed.title="edit this line";
    ed.onclick=function(){ startEdit(li,tx,m); };
    li.appendChild(ed);

    var tg=document.createElement("button"); tg.className="mini"; tg.textContent=m.on?"ON":"OFF";
    tg.onclick=function(){ m.on=m.on?0:1; paintList(); pushState(); };
    li.appendChild(tg);

    var dl=document.createElement("button"); dl.className="mini del"; dl.textContent="\u2715";
    dl.onclick=function(){ ST.msgs.splice(i,1); paintList(); pushState(); };
    li.appendChild(dl);

    ul.appendChild(li);
  });
  document.getElementById("cnt").textContent=ST.msgs.filter(function(m){return m.on;}).length;
}

/* inline edit — swaps the row text for a field, saves on Enter or blur */
function startEdit(li,tx,m){
  if(li.querySelector("input.editfield"))return;
  var inp=document.createElement("input");
  inp.type="text"; inp.className="editfield"; inp.value=m.t;
  inp.style.cssText="flex:1;min-width:0;background:var(--void);border:1px solid var(--acc);"+
    "color:var(--text);font:inherit;font-size:13px;letter-spacing:.06em;padding:7px 9px;outline:none";
  tx.style.display="none";
  li.insertBefore(inp,tx.nextSibling);
  inp.focus(); inp.select();
  var done=false;
  function save(commit){
    if(done)return; done=true;
    if(commit){
      var v=inp.value.trim();
      if(v) m.t=v;
    }
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    tx.style.display="";
    paintList();
    if(commit) pushState();
  }
  inp.onkeydown=function(e){
    if(e.key==="Enter"){ e.preventDefault(); save(true); }
    if(e.key==="Escape"){ e.preventDefault(); save(false); }
  };
  inp.onblur=function(){ save(true); };
}
function wireOvLink(){
  var f=document.getElementById("ovurl"); if(!f)return;
  var u=location.origin+location.pathname+"#overlay";
  f.value=u;
  var b=document.getElementById("copyov");
  if(b) b.onclick=function(){
    f.select();
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(function(){},function(){});
    b.textContent=ok?"COPIED":"SELECT + CTRL-C";
    setTimeout(function(){ b.textContent="COPY OBS LINK"; },1800);
  };
}

function bootDeck(){
  wireOvLink();
  document.body.className="deck";
  document.getElementById("deck").style.display="block";
  document.getElementById("sched").value=ST.sched||DEFAULTS.sched;
  document.getElementById("spd").value=ST.speed||55;
  document.getElementById("spdVal").textContent=ST.speed||55;
  paintList(); paintStatus(); connect();

  function addMsg(){
    var el=document.getElementById("newMsg"), v=el.value.trim();
    if(!v) return;
    ST.msgs.push({t:v,on:1});     /* always appended to the end */
    el.value=""; paintList(); pushState();
  }
  document.getElementById("add").onclick=addMsg;
  document.getElementById("newMsg").addEventListener("keydown",function(e){ if(e.key==="Enter") addMsg(); });

  document.getElementById("sched").addEventListener("change",function(){
    ST.sched=this.value; pushState();
  });
  document.getElementById("spd").addEventListener("input",function(){
    document.getElementById("spdVal").textContent=this.value;
  });
  document.getElementById("spd").addEventListener("change",function(){
    ST.speed=parseInt(this.value,10); pushState();
  });
  document.getElementById("push").onclick=function(){
    pushState(); this.textContent="PUSHED"; var b=this;
    setTimeout(function(){ b.textContent="FORCE PUSH TO OVERLAY"; },1200);
  };
  document.getElementById("lock").onclick=function(){
    localStorage.removeItem("tk_pin"); localStorage.removeItem("tk_role"); location.reload();
  };
}

/* ---------------- GATE ---------------- */
function getRole(pin){ return sb.rpc("pq_role",{p_pin:pin}).then(function(r){return r.error?null:r.data;}); }
function bootGate(){
  document.body.className="deck";
  document.getElementById("gate").style.display="block";
  var inp=document.getElementById("pinbox"), err=document.getElementById("err"), btn=document.getElementById("unlock");
  function tryPin(){
    var v=inp.value.trim(); if(!v) return;
    btn.textContent="CHECKING"; err.textContent="";
    getRole(v).then(function(role){
      if(role){
        localStorage.setItem("tk_pin",v); localStorage.setItem("tk_role",role);
        document.getElementById("gate").style.display="none"; bootDeck();
      } else { err.textContent="NOT RECOGNISED"; btn.textContent="UNLOCK"; inp.value=""; }
    }).catch(function(){ err.textContent="CONNECTION FAILED"; btn.textContent="UNLOCK"; });
  }
  btn.onclick=tryPin;
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter") tryPin(); });
}

/* ---------------- BOOT ---------------- */
if(IS_OVERLAY) bootOverlay();
else if(PIN && ROLE) bootDeck();
else bootGate();
})();
</script>
