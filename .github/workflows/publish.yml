# Publishes this site to GitHub Pages.
# The Supabase address + key are NOT in the code. They live in this repo's
# Settings -> Secrets and variables -> Actions, and get plugged in here
# at publish time. If a needed secret is missing, the publish stops and the
# live site stays as it was.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Refuses to publish if anything sensitive slipped into the code, or if
      # the live overlays lost their PIN lock. Nothing goes live until fixed.
      - name: Safety check
        run: |
          set -e
          bad=0
          src="--exclude-dir=.git --exclude-dir=.github -rnIE"
          if grep $src 'sb_publishable_[A-Za-z0-9]|sb_secret_|service_role' .; then
            echo "::error::A Supabase key is written into the code. Keys belong in repo Secrets only."; bad=1; fi
          if grep $src '[?&]pw=[A-Za-z0-9_-]{4,}' . | grep -v 'pw=PASSWORD'; then
            echo "::error::An OBS password (pw=) is written into the code."; bad=1; fi
          if grep $src '[?&]k=[0-9a-fA-F]{16,}' .; then
            echo "::error::An overlay key (k=) is written into the code."; bad=1; fi
          for f in slam/obs.html slam/ticker.html; do
            [ -f "$f" ] || continue
            grep -q 'seal.js' "$f" || { echo "::error::$f no longer loads seal.js (PIN lock gone)"; bad=1; }
            grep -q 'SEAL\.on(' "$f" || { echo "::error::$f no longer checks signatures"; bad=1; }
            if grep -nE 'channel\.send\(|on\("broadcast"' "$f"; then
              echo "::error::$f sends or listens without the lock"; bad=1; fi
          done
          [ -f slam/seal.js ] || { echo "::error::slam/seal.js is missing"; bad=1; }
          [ $bad -eq 0 ] || exit 1
          echo "Safety check passed."

      - name: Plug in keys
        env:
          SB_STREAM: ${{ secrets.SB_STREAM }}
          SB_FIX: ${{ secrets.SB_FIX }}
          SB_OFFSTAGE: ${{ secrets.SB_OFFSTAGE }}
        run: |
          set -e
          files=$(grep -rlI --exclude-dir=.git --exclude-dir=.github '__SB_' . || true)
          for name in STREAM FIX OFFSTAGE; do
            val=$(printenv "SB_$name" || true)
            if grep -q "__SB_${name}_" $files /dev/null; then
              if [ -z "$val" ]; then echo "::error::Secret SB_$name is missing in this repo's settings"; exit 1; fi
              url="${val%%|*}"; key="${val#*|}"
              case "$url" in https://*.supabase.co) ;; *) echo "::error::SB_$name should look like https://xxxx.supabase.co|sb_publishable_..."; exit 1;; esac
              case "$key" in sb_publishable_*) ;; *) echo "::error::SB_$name key part must start with sb_publishable_"; exit 1;; esac
              sed -i "s#__SB_${name}_URL__#${url}#g; s#__SB_${name}_KEY__#${key}#g" $files
            fi
          done
          if grep -rnI --exclude-dir=.git --exclude-dir=.github '__SB_' .; then echo "::error::placeholders left over"; exit 1; fi
          echo "Keys plugged in."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
