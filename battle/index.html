/* ============ PR0CESS_LIVE // HYBRID SYSTEM ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0A0B0D;--panel:#131619;--panel-2:#181B1F;--line:#1E2226;--line2:#2B3037;
  --text:#EFF2F5;--dim:#7E8792;--dimmer:#474E56;--acc:#3F9BFF;--accg:#8FD0FF;
  --hot:#FF3B60;--gold:#FFC94D;--win:#26D07C;
  --void:#0A0B0D;--electric:#3F9BFF;--electric-soft:rgba(63,155,255,.08)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum";
  background-image:radial-gradient(circle at 50% -8%,rgba(63,155,255,.05),transparent 55%)}
body.overlay{background:transparent;background-image:none}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:44px 24px 70px}
.wrap.wide{max-width:960px}
.amber{color:var(--acc)} .bad{color:var(--hot)} .good{color:var(--win)} .goldtxt{color:var(--gold)}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{font-family:'Code','JetBrains Mono',monospace;font-weight:400;font-size:16px;letter-spacing:.2em;color:#fff}
.brand .z{color:var(--acc)}
.brand small{display:block;font-family:'JetBrains Mono',monospace;font-weight:400;font-size:9.5px;
  letter-spacing:.28em;color:var(--dim);margin-top:7px}
.brand small .z{color:var(--acc)}
.statuspill{display:inline-flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding:7px 13px;border:1px solid var(--line2);border-radius:100px;
  color:var(--dim);white-space:nowrap}
.statuspill.open{color:var(--acc);border-color:#1c496b}
.statuspill.open::before{content:"\25CF  "}
.statuspill.closed{color:var(--hot);border-color:#5a2130}
.statuspill.closed::before{content:"\25CF  "}
.statuspill.live2{color:var(--acc);border-color:#1c496b}
.statuspill.live2::before{content:"\25CF  "}
.statuspill.gold{color:var(--gold);border-color:#5f4d1e}
.statuspill.gold::before{content:"\265B  "}

/* nav */
.modenav{display:flex;gap:4px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:4px}
.modenav a{flex:1;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--dim);padding:10px 4px;border-radius:8px;text-decoration:none;transition:color .15s}
.modenav a.on{background:var(--line2);color:#fff;font-weight:600}
.modenav a:not(.on):hover{color:var(--text)}
.modenav.adminnav{background:transparent;border:1px dashed var(--line);margin-top:-6px}
.navtag{flex:0 0 auto;display:flex;align-items:center;font-size:9px;letter-spacing:.2em;color:var(--acc);
  padding:0 10px;font-family:'Code',monospace}
.navout{flex:0 0 auto!important;color:var(--dim)!important;font-size:11px;padding:10px 12px!important}
.navout:hover{color:var(--hot)!important}

/* page head */
.pagehead{margin:24px 0 26px}
.pagehead .kick{font-size:11px;letter-spacing:.26em;color:var(--acc);margin-bottom:12px;text-transform:uppercase}
.pagehead h1{font-family:'Code',monospace;font-size:clamp(30px,7vw,46px);line-height:.95;font-weight:400;color:#fff}

/* forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.field label .req{color:var(--acc)}
input[type=text],input[type=url],input[type=password],input[type=number],textarea,select{
  width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;
  color:var(--text);padding:13px 14px;font-size:13.5px}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--dimmer)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(63,155,255,.13)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;
  border:1px solid var(--line2);border-radius:7px;color:var(--dim);background:var(--panel)}
.chip.on{color:var(--acc);border-color:#1c496b;background:var(--electric-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--acc);color:#04121f;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  font-size:13.5px;padding:15px;border-radius:9px;margin-top:6px;box-shadow:0 6px 26px rgba(63,155,255,.24);transition:filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--line2);color:var(--dimmer);cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--dim);font-weight:600;box-shadow:none}
.btn.ghost:hover{color:var(--text);border-color:var(--dim);filter:none}
.btn.slim{width:auto;padding:11px 18px;margin-top:0}
.hint{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:14px}
.hint b{color:var(--text);font-weight:500}
code{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--acc);font-size:12.5px}
.cmdref{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:13px 15px;
  font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.8}
.cmdref b{color:var(--text)}
.cmdref a{color:var(--acc)}

/* racks / strips */
.rack{display:flex;flex-direction:column;gap:7px}
.strip{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line2);
  border-radius:10px;overflow:hidden}
.strip .num{flex:0 0 42px;display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:14px;color:var(--dim);background:var(--panel-2);border-right:1px solid var(--line)}
.strip .body{flex:1;min-width:0;padding:12px 14px}
.strip .who{font-weight:600;font-size:13.5px}
.strip .title{font-size:12.5px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .meta{font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.strip .meta .tag{color:var(--acc);text-transform:uppercase;letter-spacing:.1em}
.strip .meta a{color:var(--acc);text-decoration:none}
.strip .note{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.5;padding-top:7px;border-top:1px dashed var(--line)}
.strip .acts{flex:0 0 auto;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.strip .acts button{flex:1;padding:0 13px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);border-bottom:1px solid var(--line);min-width:72px}
.strip .acts button:last-child{border-bottom:none}
.strip .acts button:hover{color:var(--text);background:var(--panel-2)}
.strip .acts button.go:hover{color:var(--acc)}
.strip .acts button.kill:hover{color:var(--hot)}
.strip.live{border-color:var(--hot)}
.strip.live .num{background:var(--hot);color:#fff}
.strip.live .who{color:var(--hot)}
.goldstrip{border-color:#5f4d1e}
.goldstrip .num{background:var(--gold);color:#0A0B0D}
.skiptag{color:var(--hot);font-size:10px;letter-spacing:.1em}
.meter{height:4px;background:var(--line);border-radius:2px;margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;width:60%;background:var(--acc);animation:vu 1.1s ease-in-out infinite alternate}
@keyframes vu{from{width:22%}to{width:92%}}
@media (prefers-reduced-motion:reduce){.meter i{animation:none;width:70%}.match.next{animation:none}}

/* section labels / dashbar */
.seclabel{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.seclabel::after{content:"";flex:1;height:1px;background:var(--line)}
.seclabel .ct{color:var(--acc)}
.dashbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.dashbar .spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);border:1px solid var(--line2);border-radius:7px;padding:9px 12px}
.miniact{font-size:11px;letter-spacing:.06em;color:var(--dim);border:1px solid var(--line2);
  border-radius:7px;padding:9px 13px;background:var(--panel);transition:all .15s}
.miniact:hover{color:var(--text);border-color:var(--dim)}
.miniact.danger{color:var(--hot);border-color:#5a2130}
.miniact.danger:hover{filter:brightness(1.2)}
.miniact.dooron{color:var(--acc);border-color:#1c496b;font-weight:700}
.miniact.dooroff{color:var(--hot);border-color:#5a2130;font-weight:700}
.miniact.dooron:hover,.miniact.dooroff:hover{filter:brightness(1.25)}
.empty{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:26px 20px;text-align:center;
  color:var(--dim);font-size:12.5px;line-height:1.7}
.empty b{color:var(--text);font-weight:500;display:block;margin-bottom:4px}
.confirm{border:1px solid #1c496b;background:rgba(63,155,255,.06);border-radius:12px;padding:26px;text-align:center}
.confirm .big{font-family:'Code',monospace;font-weight:400;font-size:24px;color:var(--acc)}
.confirm .sub{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.7}
.confirm .sub b{color:var(--text)}
.confirm .pos{font-size:44px;font-weight:800;color:var(--acc);line-height:1;margin:14px 0 6px}
.confirm.goldc{border-color:#5f4d1e;background:rgba(255,201,77,.05)}
.confirm.goldc .big{color:var(--gold)}

/* gate */
.gate{max-width:380px;margin:50px auto;text-align:center}
.gate .g-brand{font-family:'Code',monospace;font-weight:400;font-size:17px;letter-spacing:.12em;margin-bottom:6px;color:#fff}
.gate .g-brand .z{color:var(--acc)}
.gate p{color:var(--dim);font-size:12px;line-height:1.7;margin:10px 0 20px}
.gate .err{color:var(--hot);font-size:11.5px;margin-top:14px}

.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* bracket */
.bscroll{overflow-x:auto;padding:10px 2px}
.bracket{display:flex;align-items:stretch;width:max-content;gap:26px}
.rcol{display:flex;flex-direction:column}
.rtitle{font-size:10px;letter-spacing:.24em;color:var(--acc);text-transform:uppercase;text-align:center;
  margin-bottom:14px;padding:0 8px;white-space:nowrap}
.rmatches{display:flex;flex-direction:column;flex:1;justify-content:space-around;gap:12px}
.mwrap{display:flex;align-items:center;flex:1}
.match{width:190px;flex-shrink:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.match.champ-match{border-color:#5f4d1e}
.match.next{border-color:var(--acc);animation:nextpulse 1.6s ease-in-out infinite}
@keyframes nextpulse{0%,100%{box-shadow:0 0 0 1px var(--acc)}50%{box-shadow:0 0 0 1px var(--acc),0 0 18px rgba(63,155,255,.18)}}
.match[data-arm]{cursor:pointer}
.match[data-arm]:hover{border-color:var(--acc)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:5px 11px;
  border-bottom:1px solid var(--line);background:var(--panel-2);min-height:22px}
.m-num{font-size:9px;letter-spacing:.1em;color:var(--dim)}
.m-next-tag{font-size:8.5px;letter-spacing:.1em;color:var(--acc);font-weight:700}
.m-next-tag.livec{color:var(--hot)}
.slot{padding:11px 12px;font-size:12.5px;display:flex;align-items:center;gap:9px;
  white-space:nowrap;overflow:hidden;position:relative}
.slot:first-child{border-bottom:1px solid var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex-shrink:0}
.slot.win{background:rgba(63,155,255,.07);color:var(--text);font-weight:600}
.slot.win .dot{background:var(--acc)}
.slot.lose{color:var(--dimmer)}
.slot.empty{color:var(--dimmer);font-style:italic;font-size:11.5px}
.slot.bye{color:var(--dimmer)}
.slot.chs .sname{color:var(--gold)}

<script>
/* G's & VIP's BEAT BATTLE — same Supabase, same PINs as the queue. */
(function(){
"use strict";
var SUPABASE_URL="https://tewcgwhumtmjvfxcvbxl.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_1DZr_3nrtELGlEFIR3SIMA_F_ELXSdn";
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var app=document.getElementById("app");
function esc(s){return (s||"").replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function route(){return location.hash.replace("#","").split("?")[0]||"enter";}

/* ---------- state ---------- */
var B={state:'entries',champ_code:null,champ_name:null,active_match:null,subs_open:false};
var LINKS={};
var ENT=[], M=[];
var listeners=[];
function onState(fn){listeners.push(fn);fn();}
function emit(){listeners.forEach(function(fn){fn();});}
function byId(id){ for(var i=0;i<ENT.length;i++) if(ENT[i].id===id) return ENT[i]; return null; }
function nameOf(id){ var e=byId(id); return e?e.handle:"—"; }
function champEntrant(){ for(var i=0;i<ENT.length;i++) if(ENT[i].is_champ) return ENT[i]; return null; }

/* Connection health. A paused or unreachable database used to fail
   silently and look like "nobody has entered yet" — the worst possible
   lie to tell during a live show. Now it says so, on screen. */
var NETFAIL = 0, LOADED = false;
function netBanner(){
  var el = document.getElementById("netbanner");
  if(NETFAIL < 2){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement("div");
    el.id = "netbanner";
    el.className = "netbanner";
    document.body.appendChild(el);
  }
  el.innerHTML = '<b>Can\u2019t reach the database.</b> '+
    (LOADED ? 'Showing the last data received \u2014 votes and entries aren\u2019t saving right now.'
            : 'Check the Supabase project isn\u2019t paused, then refresh.');
}
function refresh(){
  return Promise.all([
    sb.from("bb_battle").select("*").eq("id",1).single(),
    sb.from("bb_entrants").select("id,handle,is_champ,created_at").order("created_at"),
    sb.from("bb_matches").select("*").order("id")
  ]).then(function(r){
    var hardFail = r[0].error && r[1].error && r[2].error;
    if(hardFail){ NETFAIL++; netBanner(); return; }
    NETFAIL = 0; LOADED = true; netBanner();
    if(!r[0].error&&r[0].data) B=r[0].data;
    if(!r[1].error) ENT=r[1].data||[];
    if(!r[2].error) M=r[2].data||[];
    emit();
    if(PIN) loadLinks();
  }).catch(function(){
    NETFAIL++; netBanner();     // network threw outright — don't leave it unhandled
  });
}
function loadLinks(){
  sb.rpc("bb_links",{p_pin:PIN}).then(function(r){
    if(!r.error&&r.data){
      var map={}; r.data.forEach(function(x){map[x.id]=x.link;});
      LINKS=map; emit();
    }
  });
}
function linkOf(id){ return LINKS[id]||null; }

/* ---------- server-synced clock ----------
   Deadlines are written by the database in server time. If we counted
   down against the browser's clock, any drift on this machine would show
   as time already gone. Measure the offset once and work in server time. */
var SKEW = 0;
function srvNow(){ return Date.now() + SKEW; }
function syncClock(){
  var t0 = Date.now();
  return sb.rpc("tv_now").then(function(r){
    if(r.error || r.data == null) return;
    var t1 = Date.now();
    SKEW = (Number(r.data) + (t1 - t0) / 2) - t1;
  }).catch(function(){});
}

/* ---------- countdown ---------- */
function fmtLeft(ms){
  if(ms<=0) return "00:00";
  var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  function p(n){return (n<10?"0":"")+n;}
  return (h>0?h+":":"")+p(m)+":"+p(x);
}
function deadlineSet(){ return !!B.deadline; }
function timerLabel(){ return B.timer_label==='cook' ? 'COOK UP' : 'UPLOAD WINDOW'; }
function uploadExpired(){
  return deadlineSet() && B.timer_label!=='cook' && new Date(B.deadline).getTime() <= srvNow();
}
var _expFired=null;
setInterval(function(){
  if(!B.deadline){ _expFired=null; return; }
  var left=new Date(B.deadline).getTime()-srvNow();
  if(left<=0 && _expFired!==B.deadline){ _expFired=B.deadline; emit(); }
  document.querySelectorAll(".tval").forEach(function(el){ el.textContent=fmtLeft(left); });
  document.querySelectorAll(".twrap").forEach(function(el){
    el.classList.toggle("tdone", left<=0);
    el.classList.toggle("tlow", left>0&&left<=60000);
  });
},500);
function startLive(){
  refresh();
  try{
    sb.channel("bb")
      .on("postgres_changes",{event:"*",schema:"public",table:"bb_battle"},refresh)
      .on("postgres_changes",{event:"*",schema:"public",table:"bb_matches"},refresh)
      .subscribe();
  }catch(e){}
  setInterval(refresh, 7000);
}

/* ---------- pins / roles (shared with the queue) ---------- */
var PIN=localStorage.getItem("pq_pin")||"", ROLE=localStorage.getItem("pq_role")||"";
function isOwner(){return ROLE==="owner";}
function getRole(pin){ return sb.rpc("pq_role",{p_pin:pin}).then(function(r){return r.error?null:r.data;}); }
/* alert() freezes the page until dismissed — bad while running a battle.
   Toasts say the same thing without blocking the next click. */
function toast(msg, bad){
  var t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.classList.add("out"); }, 2600);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, 3100);
}
function admin(cmd,extra){
  var args={p_pin:PIN,p_cmd:cmd,p_id:null,p_uuid:null,p_side:null,p_delta:null,p_matches:null,p_text:null};
  for(var k in (extra||{})) args[k]=extra[k];
  return sb.rpc("bb_admin",args).then(function(r){
    if(r.error){
      if(/bad pin/i.test(r.error.message)){PIN="";ROLE="";localStorage.removeItem("pq_pin");localStorage.removeItem("pq_role");render();}
      else if(/not allowed/i.test(r.error.message)) toast("That action is host-only.", true);
      else toast("Failed: "+r.error.message, true);
    }
    return refresh();

/* ---------- seeding (the proven no-double-skip algorithm) ---------- */
function pow2(n){var p=1;while(p<n)p*=2;return Math.max(p,2);}
function seedPositions(size){var a=[1];while(a.length<size){var n=a.length*2,out=[];a.forEach(function(s){out.push(s,n+1-s);});a=out;}return a;}
function buildBracket(){
  var champ=champEntrant();
  var rest=ENT.filter(function(e){return !e.is_champ;});
  // shuffle non-champs
  for(var i=rest.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rest[i];rest[i]=rest[j];rest[j]=t;}
  var ordered=(champ?[champ]:[]).concat(rest);           // seed 1 = champ
  var count=ordered.length, size=pow2(count), R=Math.log2(size);
  var pos=seedPositions(size);
  var slots=pos.map(function(s){return s<=count?ordered[s-1].id:null;});
  var rows=[], id=1;
  var per=size/2;
  for(var r=0;r<R;r++){
    for(var x=0;x<per;x++) rows.push({id:id++,round:r,idx:x,a:"",b:"",is_bye:false,winner:""});
    per=per/2;
  }
  function row(r,x){ return rows.filter(function(m){return m.round===r&&m.idx===x;})[0]; }
  for(var x=0;x<size/2;x++){ var m=row(0,x); m.a=slots[2*x]||""; m.b=slots[2*x+1]||""; }
  // propagate byes out of round 1
  rows.filter(function(m){return m.round===0;}).forEach(function(m){
    if(m.a&&!m.b){ m.is_bye=true; m.winner="a"; place(m,m.a); }
    else if(m.b&&!m.a){ m.is_bye=true; m.winner="b"; place(m,m.b); }
  });
  function place(m,wid){
    if(m.round===R-1) return;
    var nx=row(m.round+1,Math.floor(m.idx/2));
    if(m.idx%2===0) nx.a=wid; else nx.b=wid;
  }
  return rows;
}

function bracketHTML(interactive){
  if(!M.length) return '<div class="empty">'+(B.state==='entries'?'Bracket seeds when entries lock. '+ENT.length+' producers in so far.':'No bracket yet.')+'</div>';
  var R=Math.max.apply(null,M.map(function(m){return m.round;}))+1;
  var nextId=B.active_match;
  if(!nextId){
    var n=M.filter(function(m){return !m.winner&&m.a&&m.b;}).sort(function(a,b){return a.id-b.id;})[0];
    if(n) nextId=n.id;
  }
  var html='<div class="bscroll"><div class="bracket">';
  for(var r=0;r<R;r++){
    var ms=M.filter(function(m){return m.round===r;});
    html+='<div class="rcol"><div class="rtitle">'+roundName(r,R)+'</div><div class="rmatches">';
    ms.forEach(function(m){
      var aC=byId(m.a), bC=byId(m.b);
      var armed=B.active_match===m.id;
      var isNext=nextId===m.id&&!m.winner&&!m.is_bye;
      var hasChamp=(aC&&aC.is_champ)||(bC&&bC.is_champ);
      html+='<div class="mwrap"><div class="match'+(isNext?' next':'')+(hasChamp?' champ-match':'')+'"'+
        (interactive&&isOwner()&&!m.is_bye&&!m.winner?' data-arm="'+m.id+'"':'')+'>'+
        '<div class="m-head"><span class="m-num">M'+m.id+'</span>'+
        (armed?'<span class="m-next-tag livec">LIVE \u25B8</span>':(isNext?'<span class="m-next-tag">NEXT \u25B8</span>':''))+'</div>'+
        slot(m,'a',aC)+slot(m,'b',bC)+
      '</div></div>';
    });
    html+='</div></div>';
  }
  html+='<div class="rcol champ-col"><div class="rtitle">Champion</div><div class="rmatches"><div class="mwrap">'+
    '<div class="champ-card"><div class="clabel">Champion</div><div class="ctrophy">\u265B</div>'+
    '<div class="cname">'+(B.state==='done'&&B.champ_name?esc(B.champ_name):'\u2014')+'</div></div>'+
  '</div></div></div>';
  html+='</div></div>';
  return html;
  function slot(m,s,e){
    var win=m.winner===s, lose=m.winner&&m.winner!==s&&(s==='a'?m.a:m.b);
    var cls='slot'+(win?' win':'')+(lose?' lose':'')+(!e&&m.is_bye?' bye':'')+(!e&&!m.is_bye?' empty':'')+(e&&e.is_champ?' chs':'');
    var nm=e?esc(e.handle):(m.is_bye?'\u2014':'TBD');
    var tail='';
    if(m.is_bye&&!e){ var other=byId(s==='a'?m.b:m.a); tail='<span class="bye-tag'+((other&&other.is_champ)?' cb':'')+'">BYE</span>'; }
    else if(e&&!m.is_bye) tail='<span class="bv">'+(s==='a'?m.votes_a:m.votes_b)+'</span>';
    return '<div class="'+cls+'"><span class="dot"></span><span class="sname">'+nm+(e&&e.is_champ?' \u265B':'')+'</span>'+tail+'</div>';
  }
}

       poll means a lot of fast clicks, and waiting two round trips per vote
       makes the board feel broken. refresh() overwrites with server truth. */
    f.querySelectorAll("[data-v]").forEach(function(b){ b.onclick=function(){

/* ---------- SAMPLE FLIP LEAGUE (monthly standings) ---------- */
var LEAGUE = { participation:5, winBonus:10 };
var ALIASES = {};   // normalized alias -> canonical display name
function normHandle(s){
  return (s||'').toLowerCase().replace(/^@+/,'').replace(/\s+/g,' ').trim();
}
function canonOf(handle){
  var n = normHandle(handle);
  return ALIASES[n] ? normHandle(ALIASES[n]) : n;
}
/* ONE calculator, used by both the League tab and the Board's leader
   readout. Keeping two copies is what let them disagree. */
function standingsFrom(rows, startTs, endTs){
  var s0 = startTs ? new Date(startTs).getTime() : -Infinity;
  var s1 = endTs   ? new Date(endTs).getTime()   :  Infinity;
  var players = {}, battles = {};
  rows.forEach(function(row){
    var t = new Date(row.battle_ts).getTime();
    if(t < s0 || t > s1) return;
    battles[row.battle_ts] = true;
    var key = canonOf(row.handle);
    if(!players[key]){
      players[key] = { handle: (ALIASES[normHandle(row.handle)] || row.handle),
                       votes:0, entries:0, wins:0 };
    }
    players[key].votes   += (row.total_votes || 0);
    players[key].entries += 1;
    if(row.won) players[key].wins += 1;
  });
  var list = Object.keys(players).map(function(k){
    var p = players[k];
    p.points = p.votes + p.entries*LEAGUE.participation + p.wins*LEAGUE.winBonus;
    return p;
  });
  list.sort(function(a,b){ return b.points-a.points || b.wins-a.wins || b.votes-a.votes; });
  return { list: list, battles: Object.keys(battles).length };
}
function loadAliases(){
  return sb.from("bb_alias").select("*").then(function(r){
    ALIASES = {};
    ((r && r.data) || []).forEach(function(a){ ALIASES[a.alias] = a.canonical; });
  });
}  // points per entry, per win. votes count 1:1
function monthKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1); }
function monthLabel(d){ return d.toLocaleDateString(undefined,{month:'long',year:'numeric'}); }
function renderStandings(){
  app.innerHTML='<div class="wrap wide">'+mast('LEAGUE')+nav('standings')+
    '<div id="zone"><div class="empty">Loading standings\u2026</div></div>'+
    '<div class="foot"><span>v1.0</span><span>SAMPLE FLIP LEAGUE</span></div></div>';
  Promise.all([
    sb.from("bb_season").select("*").order("start_ts",{ascending:false}),
    sb.from("bb_archive").select("handle,total_votes,won,battle_ts").order("battle_ts",{ascending:false}),
    sb.from("bb_alias").select("*")
  ]).then(function(res){
    var z=document.getElementById("zone"); if(!z) return;
    var seasons=(res[0].data)||[], arch=(res[1].data)||[];
    ALIASES={}; ((res[2]&&res[2].data)||[]).forEach(function(a){ ALIASES[a.alias]=a.canonical; });
    if(!seasons.length){
      z.innerHTML='<div class="empty"><b>No season running yet.</b>'+
        (isOwner()?'Start Season 1 from the Board to begin scoring.':'The league kicks off when the host starts a season.')+'</div>'; return;
    }
    var active=seasons.filter(function(s){return s.active;})[0];
    var past=seasons.filter(function(s){return !s.active;});
    // default view = active season if any, else most recent past
    var viewId=(active?active.id:(past[0]&&past[0].id));

    function scoreSeason(season){
      return standingsFrom(arch, season.start_ts, season.end_ts);
    }

    function paint(id){
      var season=seasons.filter(function(s){return s.id===id;})[0]; if(!season) season=active||past[0];
      var t=scoreSeason(season);
      var picker = seasons.length>1 ? '<select id="seasonpick" class="monthpick">'+
        seasons.map(function(s){ return '<option value="'+s.id+'"'+(s.id===season.id?' selected':'')+'>'+esc(s.name||"Season")+(s.active?" (live)":"")+'</option>'; }).join('')+'</select>' : '';
      var d0=new Date(season.start_ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
      var d1=season.end_ts?new Date(season.end_ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'now';
      var leader=t.list[0];
      var html='<div class="lgtop"><div class="lgtitle">'+esc(season.name||"SAMPLE FLIP LEAGUE")+'</div>'+picker+'</div>'+
        '<div class="lgsub">'+d0+' \u2013 '+d1+' \u00b7 '+t.battles+' battle'+(t.battles===1?'':'s')+
        ' \u00b7 votes + '+LEAGUE.participation+'/entry + '+LEAGUE.winBonus+'/win'+
        (season.active?'':' \u00b7 ENDED')+'</div>';
      if(!season.active && season.champion){
        html+='<div class="lgleader"><span class="lglabel">Season Champion</span><span class="lgname">\u265B '+esc(season.champion)+'</span></div>';
      } else if(leader){
        html+='<div class="lgleader"><span class="lglabel">'+(season.active?'Current leader':'Top')+'</span><span class="lgname">\u265B '+esc(leader.handle)+'</span><span class="lgpts">'+leader.points+' pts</span></div>';
      }
      if(!t.list.length){
        html+='<div class="empty">No battles scored in this season yet. Run one and reset to see the table fill in.</div>';
      } else {
        html+='<div class="lgtable"><div class="lgrow lghead"><span class="lgrank">#</span><span class="lgh">Producer</span><span class="lgc">Pts</span><span class="lgc">Votes</span><span class="lgc">W</span><span class="lgc">Btl</span></div>';
        t.list.forEach(function(p,i){
          html+='<div class="lgrow'+(i===0?' first':'')+'"><span class="lgrank">'+(i+1)+'</span>'+
            '<span class="lgh">'+esc(p.handle)+(i===0?' \u265B':'')+'</span>'+
            '<span class="lgc lgptsval">'+p.points+'</span>'+
            '<span class="lgc">'+p.votes+'</span>'+
            '<span class="lgc">'+p.wins+'</span>'+
            '<span class="lgc">'+p.entries+'</span></div>';
        });
        html+='</div>';
      }
      z.innerHTML=html;
      var sp=document.getElementById("seasonpick");
      if(sp) sp.onchange=function(){ paint(sp.value); };
    }
    paint(viewId);
  });
}

        '<div class="ostage vscenter"><div class="ofighter"><div class="oname goldbig">'+esc(B.champ_name)+' \u265B</div></div></div>'; return;
    }
    var m=B.state==='locked'?M.filter(function(x){return x.id===B.active_match;})[0]:null;
    if(!m){ o.innerHTML=''; return; }
    var a=byId(m.a), b=byId(m.b);
    var R=Math.max.apply(null,M.map(function(x){return x.round;}))+1;
    o.innerHTML='<div class="oround">'+roundName(m.round,R)+'</div>'+
      '<div class="ostage vscenter">'+vSide(a,m.votes_a,m.winner==='a')+
      '<div class="ovs2">\u2715</div>'+vSide(b,m.votes_b,m.winner==='b')+'</div>';
    function vSide(e,v,won){
      return '<div class="ofighter'+(won?' won':'')+(e&&e.is_champ?' champ-side':'')+'">'+
        '<div class="oname">'+(e?esc(e.handle):'\u2014')+(e&&e.is_champ?' \u265B':'')+'</div>'+
        '<div class="otally">'+v+' votes</div></div>';
    }
  });
}


/* ---------- SLOT MACHINE (PIN-gated, weighted, masked reels) ---------- */
var SLOT_PRIZES=[];   // [{name, weight}]
var slotSpinning=false;

/* ---- slot sound (synthesized, no assets; muteable) ---- */
var _actx=null;
function slotMuted(){ return localStorage.getItem("bb_slot_mute")==="1"; }
function audio(){
  try{
    if(!_actx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; _actx=new AC(); }
    if(_actx.state==="suspended"&&_actx.resume) _actx.resume();
    return _actx;
  }catch(e){ return null; }
}
function slotTicks(n,dur){
  if(slotMuted()) return; var ctx=audio(); if(!ctx) return;
  var t0=ctx.currentTime;
  for(var k=1;k<=n;k++){
    var d=k/n, tt=(1-Math.pow(1-d,1/3))*dur;   // ticks spread out as it slows
    var o=ctx.createOscillator(), g=ctx.createGain(), w=t0+tt;
    o.type="square"; o.frequency.value=1250-380*d;
    g.gain.setValueAtTime(0.0001,w);
    g.gain.exponentialRampToValueAtTime(0.13,w+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,w+0.05);
    o.connect(g); g.connect(ctx.destination);
    o.start(w); o.stop(w+0.06);
  }
}
function slotChime(){
  if(slotMuted()) return; var ctx=audio(); if(!ctx) return;
  var t0=ctx.currentTime, notes=[523.25,659.25,783.99,1046.50];
  notes.forEach(function(fr,i){
    var o=ctx.createOscillator(), g=ctx.createGain(), w=t0+i*0.085;
    o.type="triangle"; o.frequency.value=fr;
    g.gain.setValueAtTime(0.0001,w);
    g.gain.exponentialRampToValueAtTime(0.2,w+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,w+0.5);
    o.connect(g); g.connect(ctx.destination);
    o.start(w); o.stop(w+0.55);
  });
}
function normPrizes(arr){
  return (arr||[]).map(function(p){
    if(typeof p==='string') return {name:p, weight:10};
    return {name:(p.name||''), weight:(typeof p.weight==='number'&&p.weight>0?p.weight:10)};
  }).filter(function(p){return p.name;});
}
function totalWeight(){ var t=0; SLOT_PRIZES.forEach(function(p){t+=p.weight;}); return t||1; }
function pickWeighted(){
  var t=totalWeight(), r=Math.random()*t, acc=0;
  for(var i=0;i<SLOT_PRIZES.length;i++){ acc+=SLOT_PRIZES[i].weight; if(r<acc) return i; }
  return SLOT_PRIZES.length-1;
}
function loadSlotPrizes(cb){
  sb.from("bb_slot").select("prizes").eq("id",1).single().then(function(r){
    if(!r.error&&r.data&&Array.isArray(r.data.prizes)) SLOT_PRIZES=normPrizes(r.data.prizes);
    if(cb) cb();
  });
}
function renderSlot(){
  if(!PIN){ renderGate(); return; }
  app.innerHTML='<div class="wrap">'+mast('SLOT')+nav('slot')+
    '<div id="slotzone"><div class="empty">Loading prizes\u2026</div></div>'+
    '<div class="foot"><span>v1.2</span><span>'+(isOwner()?'HOST':'MOD')+'</span></div></div>';
  loadSlotPrizes(function(){ paintSlot(); });
}
function paintSlot(){
  var z=document.getElementById("slotzone"); if(!z) return;
  if(!SLOT_PRIZES.length){
    z.innerHTML='<div class="empty"><b>No prizes yet.</b>Add some in the <a href="#prizes" style="color:var(--electric)">Prizes</a> tab first.</div>';
    return;
  }
  z.innerHTML=
    '<div class="slotbox">'+
      '<div class="slotwin"><div class="slotreel" id="reel"><div class="slotcell">'+esc(SLOT_PRIZES[0].name)+'</div></div><div class="slotline"></div></div>'+
      '<div class="slotctl"><button class="btn slotspin" id="spinbtn">SPIN</button>'+
        '<button class="miniact slotmute" id="slotmute" aria-label="Toggle slot sound"></button></div>'+
      '<div class="slotout" id="slotout"></div>'+
    '</div>'+
    '<div class="hint" style="text-align:center;margin-top:14px">Edit prizes &amp; odds in the <a href="#prizes" style="color:var(--electric)">Prizes</a> tab.</div>';
  document.getElementById("spinbtn").onclick=spinSlot;
  var mb=document.getElementById("slotmute");
  function paintMute(){ mb.textContent=slotMuted()?"\ud83d\udd07 Muted":"\ud83d\udd0a Sound"; mb.title=slotMuted()?"Sound off":"Sound on"; }
  paintMute();
  mb.onclick=function(){ localStorage.setItem("bb_slot_mute", slotMuted()?"0":"1"); paintMute(); if(!slotMuted()) audio(); };
}
function spinSlot(){
  if(slotSpinning||!SLOT_PRIZES.length) return;
  slotSpinning=true;
  var out=document.getElementById("slotout"); out.textContent="";
  var reel=document.getElementById("reel");
  var spinbtn=document.getElementById("spinbtn"); spinbtn.disabled=true;
  var winner=pickWeighted();
  // full spin for everyone — the host explicitly wants the suspense build
  var dur=8.2, cellH=64, loops=46;
  // roll through the real prize names, landing on the winner in the last cell
  var seq=[];
  for(var i=0;i<loops;i++) seq.push(SLOT_PRIZES[i%SLOT_PRIZES.length]);
  seq.push(SLOT_PRIZES[winner]);
  reel.innerHTML=seq.map(function(p,i){
    return '<div class="slotcell'+(i===seq.length-1?' result':'')+'">'+esc(p.name)+'</div>';
  }).join('');
  var total=(seq.length-1)*cellH;
  reel.style.transition="none"; reel.style.transform="translateY(0)";
  reel.offsetHeight;
  reel.style.transition="transform "+dur+"s cubic-bezier(.09,.82,.10,1)";
  reel.style.transform="translateY(-"+total+"px)";
  slotTicks(seq.length, dur);
  setTimeout(function(){
    slotSpinning=false; spinbtn.disabled=false;
    out.innerHTML='<span class="slotwon">\uD83C\uDFB0 '+esc(SLOT_PRIZES[winner].name)+'</span>';
    slotChime();
  }, Math.round(dur*1000)+140);
}
function renderPrizes(){
  if(!PIN){ renderGate(); return; }
  app.innerHTML='<div class="wrap">'+mast('PRIZES')+nav('prizes')+
    '<div id="slotzone"><div class="empty">Loading\u2026</div></div>'+
    '<div class="foot"><span>v1.2</span><span>'+(isOwner()?'HOST':'MOD')+'</span></div></div>';
  loadSlotPrizes(function(){ paintEditor(); });
}
// repaint the prize editor in place (NOT the slot machine, which shares #slotzone)
function paintEditor(){
  var z=document.getElementById("slotzone"); if(!z) return;
  z.innerHTML='<div class="hint" style="margin-bottom:16px">This list drives the <a href="#slot" style="color:var(--electric)">Slot</a>. Viewers never see this tab.</div>'+slotEditor();
  wireEditor();
}
function slotEditor(){
  var t=totalWeight();
  return '<div class="slotedit"><div class="seclabel">Prizes <span class="ct">'+SLOT_PRIZES.length+'</span> <span class="hint" style="margin-left:8px">weight = how often it hits</span></div>'+
    '<div class="prizerack" id="prizerack">'+
      SLOT_PRIZES.map(function(p,i){
        var pct=(p.weight/t*100);
        return '<div class="prizerow"><span class="pnum">'+(i+1)+'</span>'+
          '<input class="pin-name" data-i="'+i+'" value="'+esc(p.name).replace(/"/g,"&quot;")+'">'+
          '<input class="pin-wt" data-w="'+i+'" type="number" min="1" value="'+p.weight+'">'+
          '<span class="podds">'+pct.toFixed(1)+'%</span>'+
          '<button class="miniact" data-up="'+i+'" aria-label="Move up" title="Move up">\u2191</button>'+
          '<button class="miniact" data-dn="'+i+'" aria-label="Move down" title="Move down">\u2193</button>'+
          '<button class="kill" data-del="'+i+'" aria-label="Delete prize" title="Delete prize">\u2715</button></div>';
      }).join('')+
    '</div>'+
    '<div class="prizeadd"><input id="newprize" placeholder="new prize\u2026" maxlength="60"><input id="newwt" type="number" min="1" value="10" title="weight"><button class="miniact" id="addprize">Add</button></div>'+
    '<button class="btn slim" id="saveprizes">Save prizes</button>'+
    '<span class="hint" id="savemsg" style="margin-left:10px"></span></div>';
}
function wireEditor(){
  var rack=document.getElementById("prizerack"); if(!rack) return;
  function commit(newList){ SLOT_PRIZES=newList; paintEditor(); }
  rack.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-del"); commit(SLOT_PRIZES.filter(function(_,x){return x!==i;})); }; });
  rack.querySelectorAll("[data-up]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-up"); if(i<=0)return; var a=SLOT_PRIZES.slice(); var t=a[i-1];a[i-1]=a[i];a[i]=t; commit(a); }; });
  rack.querySelectorAll("[data-dn]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-dn"); if(i>=SLOT_PRIZES.length-1)return; var a=SLOT_PRIZES.slice(); var t=a[i+1];a[i+1]=a[i];a[i]=t; commit(a); }; });
  rack.querySelectorAll(".pin-name").forEach(function(inp){ inp.onchange=function(){ var i=+inp.getAttribute("data-i"); SLOT_PRIZES[i].name=inp.value.trim(); }; });
  rack.querySelectorAll(".pin-wt").forEach(function(inp){ inp.onchange=function(){ var i=+inp.getAttribute("data-w"); var v=parseInt(inp.value,10); SLOT_PRIZES[i].weight=(v>0?v:1); paintEditor(); }; });
  var add=document.getElementById("addprize"), np=document.getElementById("newprize"), nw=document.getElementById("newwt");
  if(add) add.onclick=function(){ var v=np.value.trim(); if(!v)return; var w=parseInt(nw.value,10); SLOT_PRIZES=SLOT_PRIZES.concat([{name:v,weight:(w>0?w:10)}]); paintEditor(); var f=document.getElementById("newprize"); if(f)f.focus(); };
  if(np) np.onkeydown=function(e){ if(e.key==="Enter"&&add) add.click(); };
  var save=document.getElementById("saveprizes");
  if(save) save.onclick=function(){
    var clean=SLOT_PRIZES.map(function(p){return {name:(p.name||"").trim(),weight:(p.weight>0?p.weight:1)};}).filter(function(p){return p.name;});
    sb.rpc("bb_slot_save",{p_pin:PIN,p_prizes:clean}).then(function(r){
      var m=document.getElementById("savemsg");
      if(r.error){ if(m){m.innerHTML='<b class="bad">Save failed.</b>';} }
      else { SLOT_PRIZES=clean; if(m){m.textContent="Saved \u2713"; setTimeout(function(){var mm=document.getElementById("savemsg"); if(mm)mm.textContent="";},1500);} }
    });
  };
}

/* ---------- mount ---------- */
function render(){
  document.body.classList.remove("overlay");
  listeners=[];
  var r=route();
  if(r==="bracket") renderBracket();
  else if(r==="standings") renderStandings();
  else if(r==="champions") renderChampions();
  else if(r==="archive") renderArchive();
  else if(r==="board") renderBoard();
  else if(r==="timer") renderTimerOverlay();
  else if(r==="versus") renderVersus();
  else if(r==="slot") renderSlot();
  else if(r==="prizes") renderPrizes();
  else if(r==="overlay") renderOverlay();
  else renderEnter();
  emit();
}
document.addEventListener("click",function(e){
  if(e.target&&e.target.id==="navlogout"){ e.preventDefault(); PIN=""; ROLE=""; localStorage.removeItem("pq_pin"); localStorage.removeItem("pq_role"); location.hash=""; render(); }
});
window.addEventListener("hashchange",render);
syncClock().then(function(){ render(); startLive(); });
setInterval(syncClock, 120000);
})();
